name: Release binaries

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: macos
          - os: windows-latest
            platform: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: cargo build --release --locked
      - name: Package Unix binary
        if: runner.os != 'Windows'
        run: tar -czf wokjo-${{ matrix.platform }}.tar.gz -C target/release wokjo
      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path target/release/wokjo.exe -DestinationPath wokjo-windows.zip
      - name: Upload to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" wokjo-${{ matrix.platform }}.* --clobber
